name: Generate Proxy Configs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "proxy_gen/config.txt"
      - "proxy_gen/domains.txt"
      - "proxy_gen/uuids.txt"
      - "proxy_gen/generate_configs.py"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: generate-proxy-configs
  cancel-in-progress: true

jobs:
  build-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate configs inside proxy_gen
        run: python proxy_gen/generate_configs.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy_gen/configs.txt proxy_gen/sub_base64.txt proxy_gen/vless.txt
          if git diff --staged --quiet; then
            echo "No changes in generated files."
          else
            git commit -m "Update proxy_gen config outputs"
            git push
          fi
